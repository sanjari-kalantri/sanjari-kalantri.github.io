# ---------------------------------------------------------------------------
# This is the only file you need to edit.
#
#   profile:  your name and affiliation — used by both outputs
#   site:     the landing page (index.html)
#   cv:       the detailed CV (compiled to PDF with LaTeX)
#
# Write plain text. Special characters (%, &, _, #, ~) are escaped for you.
# Three bits of inline formatting work everywhere:
#
#   **bold**        *italic*        [link text](https://example.com)
#
# Anything with `enabled: false` is skipped in both outputs — a tidy way to
# park an entry you might want back later without deleting it.
# Run `python3 build.py` to see your changes.
# ---------------------------------------------------------------------------

