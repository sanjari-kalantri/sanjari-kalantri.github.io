name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Generate index.html and cv.tex from cv.yml
        env:
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}
        run: python3 build.py

      - name: Compile the CV
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: build
          root_file: cv.tex
          latexmk_use_xelatex: false

      - name: Assemble the site
        run: |
          mkdir -p site
          cp build/index.html site/
          cp build/cv.pdf site/
          # Photo, papers, anything else linked from the page.
          [ -d build/assets ] && cp -r build/assets site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
